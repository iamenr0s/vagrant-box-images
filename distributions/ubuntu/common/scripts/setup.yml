---
- name: Setup Ubuntu for Vagrant
  hosts: all
  become: true
  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install additional packages for Ubuntu
      ansible.builtin.apt:
        name:
          - vim
          - wget
          - curl
          - git
          - bash-completion
          - cloud-init
          - cloud-guest-utils
          - qemu-guest-agent
          - python3
          - python3-pip
        state: present

    - name: Check if running in QEMU/KVM
      ansible.builtin.shell: dmidecode -s system-product-name 2>/dev/null || echo "unknown"
      register: system_type
      changed_when: false
      failed_when: false

    - name: Enable qemu-guest-agent service (only in virtualized environment)
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      when: "'QEMU' in system_type.stdout or 'KVM' in system_type.stdout"
      ignore_errors: true

    - name: Configure cloud-init for Vagrant
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/90_vagrant.cfg
        content: |
          datasource_list: [ NoCloud, ConfigDrive, None ]
        mode: "0644"

    - name: Disable cloud-init network configuration
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: |
          network: {config: disabled}
        mode: "0644"

    - name: Configure GRUB for consistent network device naming
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^GRUB_CMDLINE_LINUX="
        line: 'GRUB_CMDLINE_LINUX="net.ifnames=0 biosdevname=0"'
      notify: Update grub

  handlers:
    - name: Update grub
      ansible.builtin.command: update-grub
